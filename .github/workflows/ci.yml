name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04-arm
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build solution and run tests
        uses: ThorstenSauter/dotnet-actions/build-and-test@24a1e8284d22df874ef9259bf88e8c729804639e # v4.3.2

  format:
    name: Check formatting
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Verify formatting
        run: dotnet format --verify-no-changes

  pack:
    name: Pack
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pack without publishing
        uses: ThorstenSauter/dotnet-actions/pack-and-publish@24a1e8284d22df874ef9259bf88e8c729804639e # v4.3.2
        with:
          project-path: 'src/ThorstenSauter.AspNetCore.Authentication.DeviceBoundSessions/ThorstenSauter.AspNetCore.Authentication.DeviceBoundSessions.csproj'
          publish: 'false'
          version: '0.0.0-ci.${{ github.run_number }}'

  # The only check the "main" ruleset requires, so new jobs only need adding to `needs`.
  # `always()` matters: without it a failed dependency would skip this job too, and GitHub counts a
  # skipped required check as passed.
  checks-passed:
    name: CI passed
    runs-on: ubuntu-26.04-arm
    needs: [ build, format, pack ]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Fail if a check failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "::error::At least one check failed, was cancelled or was skipped."
          echo "$RESULTS"
          exit 1
      - name: All checks passed
        run: echo "Every check passed."
