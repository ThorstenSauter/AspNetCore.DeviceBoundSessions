name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04-arm
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build solution and run tests
        uses: ThorstenSauter/dotnet-actions/build-and-test@v4.3.3

  format:
    name: Check formatting
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Verify formatting
        run: dotnet format --verify-no-changes

  pack:
    name: Pack
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Package validation requires an assembly version at or above the PackageValidationBaselineVersion,
      # so CI builds are prereleases of the csproj's VersionPrefix rather than 0.0.0.
      - name: Read version prefix
        id: version
        run: |
          prefix=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' "$PROJECT_PATH")
          if [ -z "$prefix" ]; then echo "::error::No <VersionPrefix> in $PROJECT_PATH"; exit 1; fi
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        env:
          PROJECT_PATH: src/ThorstenSauter.AspNetCore.Authentication.DeviceBoundSessions/ThorstenSauter.AspNetCore.Authentication.DeviceBoundSessions.csproj
      - name: Pack without publishing
        uses: ThorstenSauter/dotnet-actions/pack-and-publish@v4.3.3
        with:
          project-path: 'src/ThorstenSauter.AspNetCore.Authentication.DeviceBoundSessions/ThorstenSauter.AspNetCore.Authentication.DeviceBoundSessions.csproj'
          publish: 'false'
          version: '${{ steps.version.outputs.prefix }}-ci.${{ github.run_number }}'

  # The only check the "main" ruleset requires, so new jobs only need adding to `needs`.
  # `always()` matters: without it a failed dependency would skip this job too, and GitHub counts a
  # skipped required check as passed.
  checks-passed:
    name: CI passed
    runs-on: ubuntu-26.04-arm
    needs: [ build, format, pack ]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Fail if a check failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "::error::At least one check failed, was cancelled or was skipped."
          echo "$RESULTS"
          exit 1
      - name: All checks passed
        run: echo "Every check passed."
