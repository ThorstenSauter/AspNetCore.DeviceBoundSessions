name: Release

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Tests and their dependencies run here, without the OIDC and attestation permissions of the publish job.
  test:
    name: Verify tag and run tests
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The ancestry check needs the history of main.
          persist-credentials: false
      - name: Verify the tagged commit is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points at $GITHUB_SHA, which is not on main. Only merged commits are released."
            exit 1
          fi
      - name: Build solution and run tests
        uses: ThorstenSauter/dotnet-actions/build-and-test@f643f68f562c38e15ff461fea32d45d0c0505131 # v4.3.1

  publish:
    name: Pack and publish to nuget.org
    needs: test
    runs-on: ubuntu-26.04-arm
    environment: nuget
    permissions:
      contents: read
      attestations: write # Build provenance attestations
      id-token: write # NuGet trusted publishing and attestation signing
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pack and publish
        uses: ThorstenSauter/dotnet-actions/pack-and-publish@f643f68f562c38e15ff461fea32d45d0c0505131 # v4.3.1
        with:
          project-path: 'src/ThorstenSauter.AspNetCore.Authentication.DeviceBoundSessions/ThorstenSauter.AspNetCore.Authentication.DeviceBoundSessions.csproj'
          version: ${{ github.event.release.tag_name }}
          nuget-user: ${{ vars.NUGET_USER }}
