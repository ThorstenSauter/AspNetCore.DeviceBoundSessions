name: Release

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and publish to nuget.org
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      attestations: write # Build provenance attestations
      id-token: write # NuGet trusted publishing and attestation signing
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build solution and run tests
        uses: ThorstenSauter/dotnet-actions/build-and-test@92a1d05c753913432277d6f3dd1a5836da1adaa4 # v4.0.0
      - name: Pack and publish
        # Pin to the release that ships pack-and-publish once it is out.
        uses: ThorstenSauter/dotnet-actions/pack-and-publish@v4
        with:
          project-path: 'src/ThorstenSauter.AspNetCore.Authentication.DeviceBoundSessions/ThorstenSauter.AspNetCore.Authentication.DeviceBoundSessions.csproj'
          version: ${{ github.event.release.tag_name }}
          nuget-user: ${{ vars.NUGET_USER }}
