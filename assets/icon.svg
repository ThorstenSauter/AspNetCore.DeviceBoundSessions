<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Device-bound credential: a key whose head is a TPM-style chip. -->
  <rect width="128" height="128" rx="24" fill="#0E4F5C"/>
  <g transform="rotate(-45 64 64)" fill="#FFFFFF">
    <!-- Chip pins: top, bottom and left edges -->
    <rect x="27" y="39" width="4" height="7" rx="1"/>
    <rect x="35" y="39" width="4" height="7" rx="1"/>
    <rect x="43" y="39" width="4" height="7" rx="1"/>
    <rect x="51" y="39" width="4" height="7" rx="1"/>
    <rect x="27" y="82" width="4" height="7" rx="1"/>
    <rect x="35" y="82" width="4" height="7" rx="1"/>
    <rect x="43" y="82" width="4" height="7" rx="1"/>
    <rect x="51" y="82" width="4" height="7" rx="1"/>
    <rect x="15" y="51" width="7" height="4" rx="1"/>
    <rect x="15" y="59" width="7" height="4" rx="1"/>
    <rect x="15" y="67" width="7" height="4" rx="1"/>
    <rect x="15" y="75" width="7" height="4" rx="1"/>
    <!-- Chip body with die -->
    <rect x="22" y="46" width="36" height="36" rx="5"/>
    <rect x="31" y="55" width="18" height="18" rx="2" fill="#0E4F5C"/>
    <rect x="36" y="60" width="8" height="8" rx="1"/>
    <!-- Key shaft and bit -->
    <rect x="56" y="60" width="50" height="8" rx="2"/>
    <rect x="84" y="66" width="7" height="11" rx="1.5"/>
    <rect x="96" y="66" width="7" height="15" rx="1.5"/>
  </g>
</svg>
